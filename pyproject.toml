[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overwatch"
version = "2.0.0"
description = "Multi-camera perception and tracking system"
requires-python = ">=3.10,<3.13"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests"
]
filterwarnings = [
    "ignore::DeprecationWarning:numpy",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "scripts/archive",
    "frontend",
    "certs",
    "**/__pycache__",
]

[tool.ruff.lint]
# Correctness-focused baseline for Phase A: E4 (imports), E7 (statements,
# incl. bare-except), E9 (syntax/runtime), F (pyflakes). Cosmetic whitespace
# rules (W, E1/E2/E5) and I/UP/B are enabled in a later quality PR.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests may use fixtures/imports that look unused to static analysis.
"backend/tests/**" = ["F401", "F811"]

[tool.mypy]
python_version = "3.10"
files = ["backend/app"]
ignore_missing_imports = true
# Pragmatic baseline — these ratchet up in later phases.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["backend/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
