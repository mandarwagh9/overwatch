name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install test + tooling deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff mypy
          pip install numpy pydantic pydantic-settings opencv-python-headless
          pip install fastapi msgpack
      - name: Lint (ruff)
        run: python -m ruff check backend scripts
      - name: Type-check (mypy)
        run: python -m mypy
      - name: Unit tests + coverage
        run: |
          python -m pytest backend/tests/unit -q \
            --cov=app --cov-report=term-missing --cov-fail-under=50
        env:
          PYTHONPATH: backend

  frontend:
    name: Frontend (eslint · jest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Unit tests (jest + RTL)
        run: npm run test:ci
      - name: Production build (runs eslint)
        run: npm run build
        env:
          CI: true
